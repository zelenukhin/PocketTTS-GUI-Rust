[workspace]
resolver = "2"
members = [
    "crates/shtorm-engine",
    "crates/text-processing",
    "crates/audio-processing",
    "crates/app-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/9208499-ship-it/teratts-android (engine derivative)"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
rand_distr = "0.4"
ndarray = "0.17"
hound = "3.5"
half = "2"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
