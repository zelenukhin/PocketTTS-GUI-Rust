[package]
name = "shtorm-engine"
description = "Shtorm PocketTTS RU ONNX engine (FP32, CPU/CUDA), derived from teratts-android rust/src/pocket.rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Диагностический доступ к TF32. В обычной сборке use_tf32=0 принудительно.
diag-tf32 = []

[dependencies]
# Тот же пин, что и в teratts-android (rust/Cargo.toml, commit edb614e):
# 2.0.0-rc.x у pre-release семвера не совместим по каретке, поэтому версия
# фактический точный пин. ORT_API_VERSION = 23 -> onnxruntime dylib >= 1.23.
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
    "load-dynamic",
    "ndarray",
    "half",
    "cuda",
] }
ndarray.workspace = true
rand.workspace = true
rand_distr.workspace = true
hound.workspace = true
half.workspace = true
rustfft = "6.2"
anyhow.workspace = true
log.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
env_logger.workspace = true
